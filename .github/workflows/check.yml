name: Check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: 2.6.0
          args: --config-path stylua.toml --check cli lib tests utils

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - run: lute setup

      - name: Lint
        run: >
          luau-lsp analyze
          --platform standard
          --base-luaurc .luaurc
          --ignore "**/.lute/**"
          --ignore "utils/unzip/**"
          cli lib tests utils

  automated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - run: lute test tests
